{% if src %}
  {# Use get_url to properly resolve the path #}
  {% set image_url = get_url(path=src) %}

  {% if href %}<a href="{{ href }}">{% endif %}
  <img
    src="{{ image_url | safe }}"
    {% if style %} style="{{ style }}"{% endif %}
    class="{% if position %}{{ position }}{% else %}center{% endif %} {% if class %}{{ class }}{% endif %}"
    loading="lazy" />
  {% if href %}</a>{% endif %}
{% endif %}
